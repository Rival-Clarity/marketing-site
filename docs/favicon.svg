<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Preserve the approved radiant-eye silhouette; adapt only its color. -->
  <style>
    .mark { fill: #244b3e; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #e0ecb7; }
    }
  </style>
  <defs>
    <mask id="logo" x="0" y="0" width="128" height="128" maskUnits="userSpaceOnUse" style="mask-type: alpha">
      <image width="128" height="128" href="data:image/png;base64," />
    </mask>
  </defs>
  <path class="mark" d="M0 0h128v128H0z" mask="url(#logo)" />
</svg>
